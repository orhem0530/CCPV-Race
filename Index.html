<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Viewport locked for native app-like experience -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121212">
    <title>Amazing Race HQ</title>

    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Sporty, Neon Dark Theme */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --neon-green: #39ff14;
            --neon-blue: #00f3ff;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --danger: #ff003c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; }

        /* Generic UI Elements */
        .btn-neon {
            background: transparent; color: var(--neon-green); border: 2px solid var(--neon-green);
            padding: 12px 24px; font-size: 16px; font-weight: bold; text-transform: uppercase;
            border-radius: 8px; cursor: pointer; transition: all 0.3s ease; width: 100%;
            text-shadow: 0 0 5px rgba(57, 255, 20, 0.5);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
        }
        .btn-neon:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 20px rgba(57, 255, 20, 0.6); }
        .btn-blue { border-color: var(--neon-blue); color: var(--neon-blue); text-shadow: 0 0 5px rgba(0, 243, 255, 0.5); box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
        .btn-blue:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 20px rgba(0, 243, 255, 0.6); }
        
        input, select {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px;
            border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 16px;
        }
        input:focus, select:focus { outline: none; border-color: var(--neon-blue); }

        /* Screens */
        .screen { display: none; min-height: 100vh; flex-direction: column; }
        .screen.active { display: flex; }

        /* Login Screen */
        #login-screen { justify-content: center; align-items: center; padding: 20px; background: linear-gradient(45deg, #000, #1a1a1a); }
        .login-card { background: var(--surface-color); padding: 30px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 4px solid var(--neon-blue); }
        .login-card h1 { text-align: center; margin-bottom: 20px; font-style: italic; letter-spacing: 2px; }

        /* App Layout */
        .header { background: var(--surface-color); padding: 15px; text-align: center; border-bottom: 2px solid var(--neon-green); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center;}
        .logout-btn { background: none; border: none; color: var(--danger); font-weight: bold; cursor: pointer; }
        
        .nav-tabs { display: flex; background: #1a1a1a; }
        .nav-tab { flex: 1; padding: 15px 0; text-align: center; cursor: pointer; border-bottom: 3px solid transparent; font-weight: bold; color: var(--text-muted); }
        .nav-tab.active { border-bottom-color: var(--neon-blue); color: var(--neon-blue); }

        .tab-content { display: none; flex: 1; padding: 15px; flex-direction: column; height: calc(100vh - 120px); overflow-y: auto;}
        .tab-content.active { display: flex; }

        /* Map Container */
        .map-container { flex: 1; min-height: 300px; border-radius: 12px; overflow: hidden; border: 2px solid #333; margin-bottom: 15px; }
        
        /* Chat UI */
        .chat-container { display: flex; flex-direction: column; flex: 1; background: var(--surface-color); border-radius: 12px; border: 1px solid #333; overflow: hidden;}
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 14px; }
        .msg.admin { align-self: flex-start; background: #2a2a2a; border-left: 3px solid var(--neon-blue); }
        .msg.team { align-self: flex-end; background: #1a3a1a; border-right: 3px solid var(--neon-green); }
        .chat-input { display: flex; padding: 10px; background: #1a1a1a; }
        .chat-input input { margin-bottom: 0; border-radius: 20px 0 0 20px; border-right: none; }
        .chat-input button { width: 80px; border-radius: 0 20px 20px 0; }

        /* Manage Teams List */
        .team-card { background: #2a2a2a; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; border-left: 4px solid var(--text-muted); }
        .team-card.active-status { border-left-color: var(--neon-green); }
        .team-info { display: flex; align-items: center; gap: 15px; }
        .team-avatar { width: 40px; height: 40px; border-radius: 50%; background: #444; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden;}
        .team-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Custom Leaflet Marker */
        .custom-marker { background: var(--surface-color); border: 2px solid var(--neon-green); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; font-size: 12px; box-shadow: 0 0 10px rgba(57,255,20,0.5); overflow: hidden; }
        .custom-marker img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="screen active">
        <div class="login-card">
            <h1>AMAZING RACE HQ</h1>
            <select id="login-role" onchange="toggleLoginFields()">
                <option value="participant">Participant Team</option>
                <option value="admin">Administrator</option>
            </select>
            
            <div id="participant-fields">
                <input type="text" id="team-name" placeholder="Enter Team Name">
            </div>
            
            <input type="password" id="login-password" placeholder="PIN / Password">
            
            <button class="btn-neon" onclick="handleLogin()">Enter Dashboard</button>
        </div>
    </div>

    <!-- ADMIN SCREEN -->
    <div id="admin-screen" class="screen">
        <div class="header">
            <span>Admin Command Center</span>
            <button class="logout-btn" onclick="logout()">LOGOUT</button>
        </div>
        <div class="nav-tabs">
            <div class="nav-tab active" onclick="switchAdminTab('map')">Live Map</div>
            <div class="nav-tab" onclick="switchAdminTab('chat')">Comms</div>
            <div class="nav-tab" onclick="switchAdminTab('manage')">Teams</div>
        </div>

        <!-- Admin Map Tab -->
        <div id="admin-map-tab" class="tab-content active">
            <div id="admin-map" class="map-container"></div>
        </div>

        <!-- Admin Chat Tab -->
        <div id="admin-chat-tab" class="tab-content">
            <select id="admin-chat-selector" onchange="loadAdminChat()">
                <option value="">Select a team to contact...</option>
            </select>
            <div class="chat-container">
                <div id="admin-chat-messages" class="chat-messages"></div>
                <div class="chat-input">
                    <input type="text" id="admin-msg-input" placeholder="Transmit message...">
                    <button class="btn-neon btn-blue" onclick="sendAdminMessage()">SEND</button>
                </div>
            </div>
        </div>

        <!-- Admin Manage Tab -->
        <div id="admin-manage-tab" class="tab-content">
            <h3>Register New Team</h3>
            <input type="text" id="new-team-name" placeholder="Team Name">
            <input type="text" id="new-team-pin" placeholder="Assign PIN">
            <label style="font-size: 12px; color: var(--text-muted);">Team Photo (Auto-compressed):</label>
            <input type="file" id="new-team-photo" accept="image/*">
            <button class="btn-neon" style="margin-bottom: 20px;" onclick="registerTeam()">Add Team</button>
            
            <h3>Active Rosters</h3>
            <div id="teams-list"></div>
        </div>
    </div>

    <!-- PARTICIPANT SCREEN -->
    <div id="participant-screen" class="screen">
        <div class="header">
            <span id="p-team-display">Team: --</span>
            <button class="logout-btn" onclick="logout()">LOGOUT</button>
        </div>
        
        <div style="padding: 15px; display: flex; flex-direction: column; height: calc(100vh - 55px);">
            <div id="participant-map" class="map-container" style="flex: 0.4;"></div>
            
            <div class="chat-container" style="flex: 0.6;">
                <div style="padding: 10px; background: #1a1a1a; font-size: 12px; text-align: center; color: var(--neon-green);">SECURE LINE TO HQ</div>
                <div id="team-chat-messages" class="chat-messages"></div>
                <div class="chat-input">
                    <input type="text" id="team-msg-input" placeholder="Message Admin...">
                    <button class="btn-neon" onclick="sendTeamMessage()">SEND</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ==========================================
        // 1. FIREBASE CONFIGURATION
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ==========================================
        // 2. GLOBAL STATE & UTILITIES
        // ==========================================
        let currentUserRole = null;
        let currentTeamId = null;
        let adminMap, participantMap;
        let activeMarkers = {}; // Flicker-free marker dictionary
        let chatUnsubscribe = null;
        let gpsWatchId = null;

        // Throttling function to save battery and Firebase quota
        function throttle(func, limit) {
            let inThrottle;
            return function() {
                const args = arguments;
                const context = this;
                if (!inThrottle) {
                    func.apply(context, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            }
        }

        // Screen Wake Lock to prevent screen turning off during the race
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    await navigator.wakeLock.request('screen');
                    console.log('Wake Lock active');
                }
            } catch (err) {
                console.warn(`Wake Lock error: ${err.message}`);
            }
        }

        // Client-side Image Compression (Canvas)
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 100;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    callback(canvas.toDataURL('image/jpeg', 0.7)); // Returns Base64 string
                }
            }
        }

        function toggleLoginFields() {
            const role = document.getElementById('login-role').value;
            document.getElementById('participant-fields').style.display = role === 'participant' ? 'block' : 'none';
        }

        // ==========================================
        // 3. AUTHENTICATION LOGIC
        // ==========================================
        async function handleLogin() {
            const role = document.getElementById('login-role').value;
            const password = document.getElementById('login-password').value;

            if (role === 'admin') {
                if (password === 'admin123') { // In production, verify against DB
                    currentUserRole = 'admin';
                    document.getElementById('login-screen').classList.remove('active');
                    document.getElementById('admin-screen').classList.add('active');
                    initAdmin();
                } else {
                    alert('Invalid Admin Password');
                }
            } else {
                const teamName = document.getElementById('team-name').value.trim();
                if (!teamName || !password) return alert('Enter Team Name and PIN');

                // Check or create team
                const teamRef = db.collection('teams').doc(teamName.replace(/\s+/g, '-').toLowerCase());
                const doc = await teamRef.get();

                if (doc.exists) {
                    if (doc.data().pin !== password) return alert('Incorrect Team PIN');
                } else {
                    // Auto-register if doesn't exist (Optional based on rules)
                    await teamRef.set({ name: teamName, pin: password, status: 'active', lat: 0, lng: 0 });
                }

                currentTeamId = teamRef.id;
                currentUserRole = 'participant';
                document.getElementById('p-team-display').innerText = `Team: ${teamName}`;
                
                document.getElementById('login-screen').classList.remove('active');
                document.getElementById('participant-screen').classList.add('active');
                
                initParticipant();
                requestWakeLock();
            }
        }

        function logout() {
            if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
            if (chatUnsubscribe) chatUnsubscribe();
            location.reload();
        }

        // ==========================================
        // 4. MAP INITIALIZATION (OpenStreetMap)
        // ==========================================
        const CEBU_COORDS = [10.3157, 123.8854];

        function createCustomIcon(teamData) {
            let innerHtml = teamData.avatarBase64 
                ? `<img src="${teamData.avatarBase64}">` 
                : teamData.name.substring(0, 2).toUpperCase();
            
            return L.divIcon({
                className: 'custom-marker',
                html: innerHtml,
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        // ==========================================
        // 5. ADMIN LOGIC
        // ==========================================
        function initAdmin() {
            // Init Admin Map
            adminMap = L.map('admin-map').setView(CEBU_COORDS, 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19, attribution: '© OpenStreetMap'
            }).addTo(adminMap);

            // Listen to Team Locations for Flicker-Free Updates
            db.collection('teams').onSnapshot(snapshot => {
                const teamSelector = document.getElementById('admin-chat-selector');
                const teamsList = document.getElementById('teams-list');
                
                // Clear UI lists (Maps handled separately)
                teamSelector.innerHTML = '<option value="">Select a team to contact...</option>';
                teamsList.innerHTML = '';

                snapshot.docChanges().forEach(change => {
                    const team = change.doc.data();
                    const tId = change.doc.id;

                    // Map Logic (Flicker-Free)
                    if (team.lat && team.lng) {
                        const latLng = [team.lat, team.lng];
                        if (change.type === 'added' || change.type === 'modified') {
                            if (activeMarkers[tId]) {
                                activeMarkers[tId].setLatLng(latLng);
                                activeMarkers[tId].setIcon(createCustomIcon(team));
                            } else {
                                activeMarkers[tId] = L.marker(latLng, {icon: createCustomIcon(team)})
                                    .addTo(adminMap).bindPopup(`<b>${team.name}</b>`);
                            }
                        }
                    }
                    if (change.type === 'removed' && activeMarkers[tId]) {
                        adminMap.removeLayer(activeMarkers[tId]);
                        delete activeMarkers[tId];
                    }

                    // Populate Chat Dropdown
                    teamSelector.innerHTML += `<option value="${tId}">${team.name}</option>`;

                    // Populate Manage Teams List
                    teamsList.innerHTML += `
                        <div class="team-card ${team.status === 'active' ? 'active-status' : ''}">
                            <div class="team-info">
                                <div class="team-avatar">${team.avatarBase64 ? `<img src="${team.avatarBase64}">` : team.name.substring(0,2).toUpperCase()}</div>
                                <div>
                                    <strong>${team.name}</strong><br>
                                    <small style="color:var(--text-muted)">PIN: ${team.pin}</small>
                                </div>
                            </div>
                            <button class="btn-neon" style="width:auto; padding: 5px 10px; font-size:12px;" onclick="deleteTeam('${tId}')">X</button>
                        </div>
                    `;
                });
            });
        }

        function switchAdminTab(tabName) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`admin-${tabName}-tab`).classList.add('active');
            
            if (tabName === 'map') setTimeout(() => adminMap.invalidateSize(), 100);
        }

        function registerTeam() {
            const name = document.getElementById('new-team-name').value;
            const pin = document.getElementById('new-team-pin').value;
            const fileInput = document.getElementById('new-team-photo');
            
            if (!name || !pin) return alert("Name and PIN required");
            const tId = name.replace(/\s+/g, '-').toLowerCase();

            const saveToDb = (avatarData) => {
                db.collection('teams').doc(tId).set({
                    name: name, pin: pin, status: 'active', lat: null, lng: null,
                    avatarBase64: avatarData || null
                }).then(() => {
                    document.getElementById('new-team-name').value = '';
                    document.getElementById('new-team-pin').value = '';
                    fileInput.value = '';
                    alert("Team Registered");
                });
            };

            if (fileInput.files.length > 0) compressImage(fileInput.files[0], saveToDb);
            else saveToDb(null);
        }

        function deleteTeam(id) {
            if(confirm("Remove this team?")) db.collection('teams').doc(id).delete();
        }

        // ==========================================
        // 6. PARTICIPANT LOGIC (GPS Tracking)
        // ==========================================
        const updateLocationThrottled = throttle((lat, lng) => {
            db.collection("teams").doc(currentTeamId).update({ lat: lat, lng: lng });
        }, 5000); // Only write to Firebase max once per 5 seconds

        function initParticipant() {
            participantMap = L.map('participant-map').setView(CEBU_COORDS, 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(participantMap);
            
            let myMarker = null;

            if (navigator.geolocation) {
                gpsWatchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        
                        // Update UI Map
                        if (!myMarker) {
                            myMarker = L.marker([lat, lng]).addTo(participantMap);
                            setTimeout(() => participantMap.invalidateSize(), 100);
                        } else {
                            myMarker.setLatLng([lat, lng]);
                        }
                        participantMap.panTo([lat, lng]);

                        // Throttled Firebase Update
                        updateLocationThrottled(lat, lng);
                    },
                    (error) => console.error("GPS Error:", error),
                    { enableHighAccuracy: true, maximumAge: 10000, timeout: 10000 }
                );
            }

            // Init their specific chat channel
            initChatStream(currentTeamId, 'team-chat-messages');
        }

        // ==========================================
        // 7. DUAL CHAT SYSTEM
        // ==========================================
        function loadAdminChat() {
            const teamId = document.getElementById('admin-chat-selector').value;
            if (!teamId) {
                document.getElementById('admin-chat-messages').innerHTML = '';
                if (chatUnsubscribe) chatUnsubscribe();
                return;
            }
            initChatStream(teamId, 'admin-chat-messages');
        }

        function initChatStream(targetTeamId, containerId) {
            if (chatUnsubscribe) chatUnsubscribe();
            const container = document.getElementById(containerId);
            
            chatUnsubscribe = db.collection('chats').doc(targetTeamId).collection('messages')
                .orderBy('timestamp', 'asc')
                .onSnapshot(snapshot => {
                    container.innerHTML = '';
                    snapshot.forEach(doc => {
                        const msg = doc.data();
                        const cssClass = msg.sender === 'admin' ? 'admin' : 'team';
                        const label = msg.sender === 'admin' ? 'HQ' : 'Team';
                        container.innerHTML += `<div class="msg ${cssClass}"><b>${label}:</b> ${msg.text}</div>`;
                    });
                    container.scrollTop = container.scrollHeight;
                });
        }

        function sendAdminMessage() {
            const teamId = document.getElementById('admin-chat-selector').value;
            const text = document.getElementById('admin-msg-input').value;
            if (!teamId || !text) return;
            
            db.collection('chats').doc(teamId).collection('messages').add({
                sender: 'admin', text: text, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            document.getElementById('admin-msg-input').value = '';
        }

        function sendTeamMessage() {
            const text = document.getElementById('team-msg-input').value;
            if (!text) return;
            
            db.collection('chats').doc(currentTeamId).collection('messages').add({
                sender: 'team', text: text, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            document.getElementById('team-msg-input').value = '';
        }
    </script>
</body>
</html>
